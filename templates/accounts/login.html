<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Login - Pegawai</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Gradient Biru Muda */
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .card-login {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 16px;
            background: #ffffff;
        }

        .card-header {
            background: #0ea5e9; /* Biru Muda Cerah (Sky Blue) */
            color: white;
            border-radius: 16px 16px 0 0 !important;
            text-align: center;
            padding: 30px 20px;
            border: none;
        }

        .btn-login {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        /* Styling Manual untuk Input Django */
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
        }

        .form-control:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
    </style>
</head>
<body>

    <div class="card card-login shadow-lg">
        <div class="card-header shadow-sm">
            <h5 class="mb-1 fw-bold">INTERNAL ACCESS</h5>
            <small class="opacity-75">Sistem Informasi Penerimaan Audiensi</small>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert alert-danger py-2 small">
                    Username atau password salah.
                </div>
                {% endif %}

                <!-- Render Manual Field agar bisa dipasang Class Bootstrap -->
                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                    <input type="text" name="{{ form.username.name }}" 
                           id="{{ form.username.id_for_label }}" 
                           class="form-control" 
                           placeholder="Masukkan ID Pegawai" required>
                </div>

                <div class="mb-4">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                    <input type="password" name="{{ form.password.name }}" 
                           id="{{ form.password.id_for_label }}" 
                           class="form-control" 
                           placeholder="••••••••" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-login">MASUK KE DASHBOARD</button>
                </div>
            </form>
        </div>
        <div class="card-footer bg-transparent border-0 text-center pb-4">
            <p class="text-muted mb-0" style="font-size: 0.75rem;">
                DPRD Kabupaten Garut &bull; 2026
            </p>
        </div>
    </div>

</body>
</html>
